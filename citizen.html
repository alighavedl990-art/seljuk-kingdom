<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1410"><title>شهروند سلجوقی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1b1410;color:#f3e2b8;font-family:Vazirmatn,Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.bx{background:#2a1d14;border:3px solid #d9a540;box-shadow:0 0 0 2px #120c08;padding:4px 10px;font-weight:800;font-size:13px;line-height:1.7}
#hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;pointer-events:none}
#hud>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.bar{height:8px;background:#120c08;margin-top:2px}.bar i{display:block;height:100%;background:#5fb04a}
#mm{width:96px;height:96px;display:block;border:3px solid #d9a540;image-rendering:pixelated}
#dock{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;gap:6px}
#toast{background:#16254a;border:3px solid #d9a540;box-shadow:0 0 0 2px #120c08;padding:8px 12px;font-weight:800;font-size:14px;line-height:1.8;min-height:44px}
button{font:inherit;font-weight:800;color:#f3e2b8;background:#2a1d14;border:3px solid #d9a540;box-shadow:0 0 0 2px #120c08;padding:8px 4px;font-size:13px}
button:active{background:#4a3322}
#act{background:#d9a540;color:#2a1d14;font-size:16px;padding:12px}
#nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#pn{position:fixed;inset:0;background:rgba(10,6,4,.8);display:none;align-items:center;justify-content:center;padding:16px}
#pn>div{background:#2a1d14;border:3px solid #d9a540;padding:14px;width:100%;max-width:380px;font-size:14px;line-height:2}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div style="flex:1"><div class="bx" id="h1"></div><div class="bx" id="h2"></div><div class="bx" id="h3"></div><div class="bx" id="h4"></div></div><canvas id="mm" width="96" height="96"></canvas></div>
<div id="dock"><div id="toast"></div><button id="act" onclick="act()"></button>
<div id="nav"><button onclick="go('field')">مزرعه</button><button onclick="go('mine')">معدن</button><button onclick="go('market')">بازار</button><button onclick="go('hall')">تالار</button><button onclick="me()">من</button></div></div>
<div id="pn" onclick="if(event.target==this)this.style.display='none'"><div id="pb"></div></div>
<script>
const $=i=>document.getElementById(i),fa=n=>Math.floor(n).toLocaleString('fa-IR');
// نام، رنگ زمین، پاداش کشاورزی، پاداش معدن
const SE=[['بهار','#8fb35a',.2,0],['تابستان','#c9b25a',.1,.1],['پاییز','#c98f4e',.3,0],['زمستان','#dfe6ea',0,.3]];
const Z={field:[2,2,7,5,'مزرعه'],mine:[13,2,5,4,'معدن'],market:[2,11,5,4,'بازار'],hall:[12,10,6,5,'تالار شهر']};
const N=20,T=44;let S,pl,tg=null,cam={x:0,y:0},NP=[],last=performance.now(),hv=0,sv=0,mv=0;
const fresh=()=>({coin:20,en:70,wheat:0,ore:0,xp:0,works:0,price:1,pt:20,clock:0,x:10,y:8});
try{S=JSON.parse(localStorage.getItem('citizen1'))}catch(e){}if(!S||S.x===undefined)S=fresh();
const save=()=>{try{localStorage.setItem('citizen1',JSON.stringify(S))}catch(e){}};
const sea=()=>Math.floor(S.clock/120)%4,fest=()=>S.clock%300<60,lv=()=>1+Math.floor(Math.sqrt(S.xp)),mx=()=>70+5*lv();
const bon=k=>(k=='field'?SE[sea()][2]:SE[sea()][3])+(fest()?.2:0)+.05*(lv()-1);
function t(m){$('toast').textContent=m}
function zone(){for(const k in Z){const[a,b,w,h]=Z[k];if(S.x>=a-1&&S.x<a+w+1&&S.y>=b-1&&S.y<b+h+1)return k}return null}
function go(k){const[a,b,w,h]=Z[k];tg={x:a+w/2,y:b+h+.6>N-.5?b+h-.5:b+h+.6};if(k=='field'||k=='mine')tg.y=b+h/2}
function act(){const z=zone();if(!z)return t('به مزرعه، معدن، بازار یا تالار شهر بروید.');
 if(z=='market'){const c=Math.floor((S.wheat*3+S.ore*8)*S.price);if(!c)return t('کالایی برای فروش ندارید.');S.coin+=c;S.wheat=S.ore=0;t('کالاها فروخته شد: '+fa(c)+' سکه.')}
 else if(z=='hall'){if(S.coin<50)return t('برای کمک به شهر ۵۰ سکه لازم است.');const o=lv();S.coin-=50;S.xp++;t(lv()>o?'شهر به پایهٔ '+fa(lv())+' رسید! دسترنج شما بیشتر شد.':'ممنون! شهر کمی آباد‌تر شد.')}
 else{if(S.en<3)return t('انرژی کافی نیست؛ کمی صبر کنید.');S.en-=3;const b=1+bon(z),g=Math.max(1,Math.round((z=='field'?2:1)*b*(.8+Math.random()*.4)));S[z=='field'?'wheat':'ore']+=g;S.works++;t('دست مریزاد! '+fa(g)+(z=='field'?' گندم':' سنگ طلا')+' (دسترنج '+fa(b*100-100)+'٪ بیشتر)')}
 save()}
function me(){$('pb').innerHTML='<b>شهروند سلجوقی</b><br>🪙 '+fa(S.coin)+' · 🌾 '+fa(S.wheat)+' · ⛏ '+fa(S.ore)+'<br>پایهٔ شهر: '+fa(lv())+' · دفعات کار: '+fa(S.works)+'<br>قیمت بازار: '+fa(S.price*100)+'٪<br><button onclick="$(\'pn\').style.display=\'none\'">بستن</button> <button onclick="if(confirm(\'همه‌چیز پاک شود؟\')){S=fresh();save();location.reload()}">شروع دوباره</button>';$('pn').style.display='flex'}
function rnd(){return{x:2+Math.random()*16,y:2+Math.random()*16,c:['#2a6f97','#8a5a9e','#3a8f5c','#c9772e','#e8e0c8'][Math.random()*5|0]}}
function upd(dt){S.clock+=dt;S.en=Math.min(mx(),S.en+dt/2.5);S.pt-=dt;if(S.pt<=0){S.pt=20;S.price=Math.max(.7,Math.min(1.4,S.price+(Math.random()-.5)*.3))}
 if(tg){const dx=tg.x-S.x,dy=tg.y-S.y,d=Math.hypot(dx,dy),v=4*dt;if(d<=v){S.x=tg.x;S.y=tg.y;tg=null}else{S.x+=dx/d*v;S.y+=dy/d*v}}
 const n=Math.min(10,lv()+2);while(NP.length<n)NP.push(rnd());NP.length=n;
 NP.forEach(p=>{if(!p.tx||Math.hypot(p.tx-p.x,p.ty-p.y)<.1){p.tx=1+Math.random()*18;p.ty=1+Math.random()*18}const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy)||1;p.x+=dx/d*1.1*dt;p.y+=dy/d*1.1*dt})}
// ---- رسم ----
const cv=$('c'),cx=cv.getContext('2d'),mm=$('mm').getContext('2d');let W,H,DPR;
function rs(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
const hs=(x,y)=>((x*73856093)^(y*19349663))>>>0;
function ty(x,y){for(const k in Z){const[a,b,w,h]=Z[k];if(x>=a&&x<a+w&&y>=b&&y<b+h)return k}if(y==9)return x==10?'bridge':'water';return x==10||y==8?'path':'grass'}
function tile(x,y){const k=ty(x,y),h=hs(x,y),px=x*T,py=y*T,C={field:'#9b5f2c',mine:'#7b7b80',market:'#caa971',hall:'#e0cfa0',water:'#2f6fa5',bridge:'#8a5a2b',path:'#d9b57a'};
 cx.fillStyle=C[k]||SE[sea()][1];cx.fillRect(px,py,T,T);
 if(k=='field'){cx.fillStyle=['#6fae3f','#e0b23a','#e0b23a','#d8d8d0'][sea()];for(let r=0;r<4;r++)for(let q=0;q<5;q++)cx.fillRect(px+4+q*8,py+5+r*10,4,5)}
 else if(k=='mine'){cx.fillStyle='#55555a';if(h%2)cx.fillRect(px+6,py+8,16,12);if(h%3==0){cx.fillStyle='#f2c94c';cx.fillRect(px+24,py+24,6,6)}}
 else if(k=='water'){cx.fillStyle='#5e9bd0';cx.fillRect(px+((S.clock*20+h)%T|0),py+(h%3)*12+6,10,3)}
 else if(k=='bridge'){cx.fillStyle='#5e3a1a';for(let i=0;i<4;i++)cx.fillRect(px,py+i*11,T,2)}
 else if(k=='grass'&&h%5==0){cx.fillStyle='rgba(0,0,0,.12)';cx.fillRect(px+h%30,py+(h>>3)%30,5,4)}}
function tree(x,y){const px=x*T,py=y*T;cx.fillStyle='#5e3a1a';cx.fillRect(px+17,py+22,8,18);cx.fillStyle=['#4f9a3c','#3d8a35','#d9722a','#e8eef0'][sea()];cx.fillRect(px+6,py+6,30,20);cx.fillRect(px+10,py+1,22,8)}
function man(x,y,c,pl){cx.fillStyle='rgba(0,0,0,.25)';cx.fillRect(x-10,y-2,20,4);cx.fillStyle='#4a3426';cx.fillRect(x-6,y-10,12,10);cx.fillStyle=c;cx.fillRect(x-8,y-26,16,16);cx.fillStyle='#e8b98a';cx.fillRect(x-6,y-38,12,12);cx.fillStyle='#2b1b12';cx.fillRect(x-7,y-40,14,5);if(pl){cx.fillStyle='#c0392b';cx.fillRect(x-7,y-35,14,3)}}
function draw(){cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#1b1410';cx.fillRect(0,0,W,H);
 cam.x=N*T<W?N*T/2:Math.max(W/2,Math.min(N*T-W/2,S.x*T));cam.y=N*T<H?N*T/2:Math.max(H/2,Math.min(N*T-H/2,S.y*T));
 const ox=Math.round(W/2-cam.x),oy=Math.round(H/2-cam.y);cx.translate(ox,oy);
 const x0=Math.max(0,Math.floor(-ox/T)),x1=Math.min(N-1,Math.ceil((W-ox)/T)),y0=Math.max(0,Math.floor(-oy/T)),y1=Math.min(N-1,Math.ceil((H-oy)/T));
 for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)tile(x,y);
 for(let i=0;i<2;i++){const x=(3+2*i)*T,y=12*T;cx.fillStyle='#8a5a2b';cx.fillRect(x,y,T*1.6,T*.8);for(let j=0;j<4;j++){cx.fillStyle=j%2?'#f2e6c0':'#1f9aa0';cx.fillRect(x+j*T*.4,y-T*.45,T*.4,T*.45)}}
 cx.fillStyle='#e9d9a8';cx.fillRect(13*T,10*T,4*T,3*T);cx.fillStyle='#1f3c88';cx.fillRect(13*T,10*T,4*T,T*.7);cx.fillStyle='#e0a82e';cx.beginPath();cx.arc(15*T,10*T,T*.9,Math.PI,0);cx.fill();cx.fillStyle='#5e3a1a';cx.fillRect(14.6*T,11.9*T,T*.8,T*1.1);
 cx.font='800 14px Vazirmatn,Tahoma';cx.textAlign='center';cx.lineWidth=4;cx.strokeStyle='#1b1410';cx.fillStyle='#fff';
 for(const k in Z){const[a,b,w]=Z[k],tx=(a+w/2)*T,tyy=(b+.6)*T-(k=='hall'||k=='market'?T*.9:0);cx.strokeText(Z[k][4],tx,tyy);cx.fillText(Z[k][4],tx,tyy)}
 const L=[];for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)if(ty(x,y)=='grass'&&hs(x,y)%9==0)L.push({y:y+1,f:()=>tree(x,y)});
 NP.forEach(p=>L.push({y:p.y,f:()=>man(p.x*T,p.y*T,p.c,0)}));L.push({y:S.y,f:()=>man(S.x*T,S.y*T,'#3a6f8f',1)});
 L.sort((a,b)=>a.y-b.y).forEach(o=>o.f())}
function mini(){const s=96/N;mm.fillStyle=SE[sea()][1];mm.fillRect(0,0,96,96);mm.fillStyle='#2f6fa5';mm.fillRect(0,9*s,96,s);mm.fillStyle='#8a5a2b';mm.fillRect(10*s,9*s,s,s);
 const C={field:'#a8672f',mine:'#7b7b80',market:'#caa971',hall:'#e9d9a8'};for(const k in Z){const[a,b,w,h]=Z[k];mm.fillStyle=C[k];mm.fillRect(a*s,b*s,w*s,h*s)}mm.fillStyle='#c0392b';mm.fillRect(S.x*s-3,S.y*s-3,6,6)}
function hud(){const s=SE[sea()],f=fest(),l=f?60-S.clock%300:300-S.clock%300,m=Math.floor(l/60),sc=Math.floor(l%60),z=zone();
 $('h1').innerHTML='🪙 '+fa(S.coin)+' &nbsp; ⚡ '+fa(S.en)+' / '+fa(mx())+'<div class="bar"><i style="width:'+S.en/mx()*100+'%"></i></div>';
 $('h2').innerHTML='شهر سلجوق · پایهٔ '+fa(lv())+' · 👥 '+fa(NP.length)+' در شهر';
 $('h3').innerHTML=(f?'🎉 جشن: ۲۰٪ دسترنج بیشتر · ':'جشن بعدی تا ')+fa(m)+':'+(sc<10?'۰':'')+fa(sc);
 $('h4').innerHTML=s[0]+' · کشاورزی '+fa(s[2]*100)+'٪ · معدن '+fa(s[3]*100)+'٪';
 $('act').textContent={field:'کار دستی: درو گندم',mine:'کار دستی: استخراج طلا',market:'فروش همه کالاها',hall:'کمک به شهر (۵۰ سکه)'}[z]||'به یک محل کار بروید'}
cv.addEventListener('pointerdown',e=>{tg={x:Math.max(.5,Math.min(N-.5,(e.clientX-(W/2-cam.x))/T)),y:Math.max(.5,Math.min(N-.5,(e.clientY-(H/2-cam.y))/T))}});
function loop(n){const dt=Math.min(.25,(n-last)/1000);last=n;upd(dt);draw();hv+=dt;sv+=dt;mv+=dt;if(hv>.25){hv=0;hud()}if(mv>.2){mv=0;mini()}if(sv>5){sv=0;save()}requestAnimationFrame(loop)}
addEventListener('resize',rs);addEventListener('pagehide',save);addEventListener('visibilitychange',()=>{if(document.hidden)save()});
rs();t('به مزرعه بروید و «کار دستی» را بزنید. برای راه رفتن روی نقشه بزنید.');requestAnimationFrame(loop);
</script></body></html>
