<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17151a"><title>پادشاهی سلجوقیان</title><link rel="stylesheet" href="src/style.css"></head>
<body><main class="game">
<header class="hud"><section class="resources"><div class="meter"><b id="energy">۱۲۰</b><span class="bar"><i></i></span><strong>⚡</strong><b id="gold">۴۰٬۴۰۹</b> 🪙</div><div class="people">👥 <b id="population">۱۲۰</b>　👑 پایه ۵　🏙️ <b id="city">یزد</b></div><div class="weather">☀️ <span id="weather">آفتابی</span> · <span id="clock">۱۸:۵۴</span></div></section>
<section class="king"><div><b>سلطان ملکشاه</b><small>خزانه‌دار · بزرگ و نانو</small></div><span class="king-avatar">♟️</span></section></header>
<aside class="minimap"><canvas id="mini" width="160" height="112"></canvas><b>شهر یزد</b></aside>
<nav class="right-menu"><button data-tab="gift"><span>🎁</span>امروز</button><button data-tab="sound"><span>🔇</span>بی‌صدا</button><button data-tab="weather"><span>🌧️</span>آب‌وهوا</button><button data-tab="mail"><span>✉️</span>نامه</button><button data-tab="book"><span>📖</span>دانشنامه</button></nav>
<section class="scene"><canvas id="world"></canvas><div class="name-tag">سلطان ملکشاه</div><div class="rain" id="rain"></div><div class="mobile-pad"><button data-move="up">▲</button><div><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div></div></section>
<nav class="bottom-menu"><button class="active" data-tab="court"><span>📜</span>دربار</button><button data-tab="me"><span>👤</span>من</button><button data-tab="cities"><span>🚩</span>شهرها</button><button data-tab="news"><span>📖</span>خبرها</button><button data-tab="bag"><span>👜</span>کوله</button><button data-tab="chat"><span>💬</span>گفتگو</button></nav>
<div class="dialog" id="dialog"><div class="dialog-box"><button id="closeDialog">✕</button><h2 id="dialogTitle">دربار</h2><p id="dialogText">به شهر یزد خوش آمدید، سلطان.</p><div id="dialogActions"></div></div></div>
</main><script src="src/game.js"></script></body></html>
